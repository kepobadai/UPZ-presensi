<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - UPZ Attendance</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f1f5f9;display:grid;place-items:center;padding:20px;font-family:Arial;color:#1e293b}
.card{width:100%;max-width:410px;background:white;padding:35px;border-radius:18px;box-shadow:0 8px 35px #0001}
.logo{width:65px;height:65px;background:#102d50;color:white;border-radius:15px;display:grid;place-items:center;font-weight:bold;margin:auto;font-size:20px}
h1{text-align:center;font-size:24px;margin-top:20px}
.subtitle{text-align:center;color:#64748b;font-size:13px;margin:10px 0 30px}
label{display:block;font-size:13px;font-weight:bold;margin:17px 0 8px}
input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}
button{width:100%;padding:15px;margin-top:25px;border:0;border-radius:8px;background:#102d50;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
#message{text-align:center;color:#dc2626;font-size:13px;margin-top:15px}
.footer{text-align:center;margin-top:30px;font-size:11px;color:#94a3b8;line-height:1.7}
</style>
</head>
<body>
<div class="card">
 <div class="logo">UPZ</div>
 <h1>Selamat Datang</h1>
 <p class="subtitle">Sistem Presensi Digital Duta UPZ UNPAM</p>

 <form id="loginForm">
  <label>Email</label>
  <input type="email" id="email" placeholder="Masukkan email" required>
  <label>Password</label>
  <input type="password" id="password" placeholder="Masukkan password" required>
  <button type="submit" id="loginButton">MASUK</button>
 </form>

 <div id="message"></div>
 <div class="footer">UNIVERSITAS PAMULANG<br>DUTA UPZ ATTENDANCE SYSTEM</div>
</div>

<script src="config.js"></script>
<script>
const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

form.addEventListener("submit", async function(e){
 e.preventDefault();
 button.disabled = true;
 button.textContent = "MEMERIKSA...";
 message.textContent = "";

 const email = document.getElementById("email").value;
 const password = document.getElementById("password").value;

 const r = await apiCall("login", { email: email, password: password });

 button.disabled = false;
 button.textContent = "MASUK";

 if (!r || !r.success) {
  message.textContent = r?.message || "Login gagal.";
  return;
 }

 sessionStorage.setItem("upz_token", r.token);
 sessionStorage.setItem("upz_user", JSON.stringify(r.user));

 message.style.color = "#16845b";
 message.textContent = "Login berhasil. Mengalihkan...";

 setTimeout(() => {
   if (r.user.role === "SUPER_ADMIN") {
     window.location.href = "dashboard.html";
   } else {
     window.location.href = "duta.html";
   }
 }, 800);
});
</script>
</body>
</html>
